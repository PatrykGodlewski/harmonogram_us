  - Gdy usługa jest podłączona i autor prześle materiał, wtedy usługa dostaje powiadomienie o nowym materiale, a materiał ma stan „Nowy”, dopóki usługa nie odpowie, że jest gotowy do recenzji.
  - Gdy usługa nie odpowiada przy przesyłaniu, wtedy autor widzi komunikat, że przesłanie się nie powiodło i trzeba spróbować później, a materiał nie powstaje.
  - Gdy redaktor zrecenzuje materiał, wtedy usługa dostaje informację o akcji i może dodać komentarze systemowe, zmienić tagi i zdecydować, czy przyjęta rewizja zostaje opublikowana.
  - Gdy materiał zostanie usunięty, wtedy usługa dostaje informację o usunięciu; gdy nie odpowiada, wtedy usunięcie kończy się komunikatem o niepowodzeniu.
  role:
  - uczestnik
  - organizator
  - administrator
