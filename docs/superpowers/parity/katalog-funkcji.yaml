- id: F-EDI-01.20
  domena: EDI
  tytul: Przejścia stanów materiału redakcyjnego
  zachowanie:
  - Gdy autor prześle materiał (bez zewnętrznej usługi), wtedy materiał ma stan „Gotowy do recenzji”; z usługą zaczyna w stanie „Nowy”, dopóki usługa nie oznaczy go jako gotowy.
  - Gdy redaktor w stanie „Gotowy do recenzji” zaakceptuje, odrzuci, poprosi o zmiany albo wprowadzi zmiany, wtedy stan to odpowiednio „Przyjęty”, „Odrzucony”, „Wymaga zmian” albo „Wymaga potwierdzenia”.
  - Gdy autor w stanie „Wymaga potwierdzenia” zaakceptuje albo odrzuci zmiany, wtedy stan to „Przyjęty przez autora” albo „Wymaga zmian”.
  - Gdy autor w stanie „Wymaga zmian” prześle nową rewizję, wtedy stan wraca do „Gotowy do recenzji”.
  - Gdy redaktor cofnie recenzję, wtedy stan wraca do stanu sprzed tej recenzji; gdy usługa zresetuje materiał „Przyjęty” albo „Przyjęty przez autora”, wtedy stan to „Gotowy do recenzji”.
  - Gdy redaktor (poza działaniem menedżerskim) próbuje recenzować materiał w stanie innym niż „Gotowy do recenzji”, wtedy widzi komunikat o nieaktualnej osi czasu i stan się nie zmienia.
  - Gdy autor próbuje potwierdzić zmiany w stanie innym niż „Wymaga potwierdzenia” albo przesłać rewizję w stanie „Przyjęty”, „Odrzucony” lub „Wymaga potwierdzenia”, wtedy dostaje komunikat o nieaktualnej
    osi czasu.
  - Gdy menedżer zbiorczo zaakceptuje materiał w stanie „Odrzucony”, wtedy stan to „Przyjęty” (działanie menedżerskie pomija wymóg stanu „Gotowy do recenzji”).
