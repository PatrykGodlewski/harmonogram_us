  - Gdy usługa zewnętrzna zastąpi rewizję w stanie „Nowy” albo „Gotowy do recenzji”, wtedy powstaje rewizja typu „zastąpienie” i materiał jest „Gotowy do recenzji”; gdy zresetuje przyjęty materiał, wtedy
    rewizja typu „reset”.
