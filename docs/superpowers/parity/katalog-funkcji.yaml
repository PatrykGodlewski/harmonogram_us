  - Gdy organizator otwiera listę funkcji spotkania albo wykładu, wtedy nie widzi na niej abstraktów, referatów naukowych, redakcji ani menedżera obrazów, które są dostępne tylko dla konferencji.
  - Gdy organizator tworzy wykład, wtedy formularz pyta o prelegentów i pozwala podać kilka terminów, a formularz spotkania i konferencji pyta o przewodniczących i jeden termin.
