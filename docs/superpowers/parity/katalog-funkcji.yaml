- id: F-REJ-05.1
  domena: REJ
  tytul: Przejścia stanów rejestracji
  zachowanie:
  - Gdy uczestnik zapisze się do formularza bez moderacji i bez opłaty, wtedy rejestracja ma stan „zakończona”.
  - Gdy uczestnik zapisze się do formularza z moderacją, wtedy rejestracja ma stan „oczekuje na moderację”.
  - Gdy uczestnik zapisze się do formularza z opłatą przy włączonych płatnościach, wtedy rejestracja ma stan „oczekuje na płatność”.
  - Gdy organizator zatwierdzi rejestrację oczekującą bez opłaty, wtedy przechodzi ona do stanu „zakończona”, a z opłatą do stanu „oczekuje na płatność”.
  - Gdy organizator odrzuci rejestrację oczekującą, wtedy przechodzi ona do stanu „odrzucona”.
  - Gdy płatność rejestracji „oczekuje na płatność” zostanie zaksięgowana, wtedy przechodzi ona do stanu „zakończona”.
  - Gdy uczestnik lub organizator wycofa rejestrację oczekującą, nieopłaconą albo zakończoną, wtedy przechodzi ona do stanu „wycofana”.
  - Gdy organizator cofnie decyzję dla rejestracji zakończonej, odrzuconej lub wycofanej w formularzu z moderacją, wtedy wraca ona do stanu „oczekuje na moderację”.
  - Gdy organizator anuluje płatność rejestracji zakończonej z opłatą, wtedy wraca ona do stanu „oczekuje na płatność”.
  - Gdy organizator próbuje cofnąć decyzję dla rejestracji oczekującej na moderację, wtedy widzi komunikat, że w tym stanie nie można jej zresetować.
  - Gdy organizator próbuje wycofać rejestrację odrzuconą lub już wycofaną, wtedy widzi komunikat, że w tym stanie nie można jej wycofać.
  - Gdy organizator próbuje przywrócić wycofaną rejestrację, a ta sama osoba ma już inną ważną rejestrację w formularzu, wtedy widzi błąd o konflikcie.
  role:
  - anonim
  - uczestnik
  - organizator
  - administrator
  dowod_indico:
  - indico/modules/events/registration/models/registrations.py::RegistrationState
  - indico/modules/events/registration/models/registrations.py::Registration.update_state
  - indico/modules/events/registration/models/registrations.py::Registration.sync_state
  - indico/modules/events/registration/models/registrations.py::Registration.reset_state
  - indico/modules/events/registration/models/registrations_test.py
