- id: F-PLT-02.1
  domena: PLT
  tytul: Przejścia stanów transakcji
  zachowanie:
  - Gdy bramka potwierdzi płatność rejestracji bez transakcji, wtedy transakcja ma stan „udana”.
  - Gdy bramka zgłosi płatność oczekującą, wtedy transakcja ma stan „oczekująca”, a później przechodzi do „udana” po potwierdzeniu albo do „odrzucona” po odmowie.
  - Gdy organizator anuluje transakcję udaną albo oczekującą, wtedy transakcja ma stan „anulowana”.
  - Gdy bramka zgłosi drugą udaną płatność dla już opłaconej rejestracji, wtedy nie powstaje nowa transakcja, a organizatorzy są informowani o podwójnej płatności.
  - Gdy bramka zgłosi odmowę dla rejestracji bez oczekującej transakcji, wtedy stan się nie zmienia.
  - Gdy organizator próbuje oznaczyć jako opłaconą rejestrację z transakcją oczekującą, wtedy stan transakcji się nie zmienia.
  role:
  - organizator
  - administrator
  dowod_indico:
  - indico/modules/events/payment/models/transactions.py::TransactionStatus
