- id: F-ABS-03.1
  domena: ABS
  tytul: Przejścia stanów abstraktu
  zachowanie:
  - Gdy zaproszony autor wyśle formularz zaproszenia, wtedy abstrakt przechodzi ze stanu „Zaproszony” do „Złożony”.
  - Gdy sędzia wyda decyzję „Akceptuj”, „Odrzuć”, „Oznacz jako duplikat” albo „Scal” dla abstraktu w stanie „Złożony”, wtedy abstrakt ma odpowiednio stan „Przyjęty”, „Odrzucony”, „Duplikat” albo „Scalony”
    i stan widać na liście abstraktów.
  - Gdy zgłaszający wycofa abstrakt w stanie „Złożony”, wtedy abstrakt ma stan „Wycofany”.
  - Gdy organizator z uprawnieniem „Abstrakty” wycofa abstrakt w stanie „Przyjęty”, „Odrzucony”, „Scalony”, „Duplikat” albo „Zaproszony”, wtedy abstrakt ma stan „Wycofany”, a powiązany referat zostaje usunięty.
  - Gdy sędzia zresetuje decyzję abstraktu przyjętego, odrzuconego, scalonego albo duplikatu, wtedy abstrakt wraca do stanu „Złożony” bez komentarza i bez sędziego.
  - Gdy organizator z uprawnieniem „Abstrakty” przywróci abstrakt „Wycofany”, wtedy abstrakt wraca do stanu „Złożony”.
  - Gdy sędzia próbuje wydać decyzję dla abstraktu w stanie innym niż „Złożony”, wtedy formularza decyzji nie ma, a bezpośrednie żądanie kończy się odmową.
  - Gdy zgłaszający próbuje wycofać abstrakt już oceniony (przyjęty, odrzucony, scalony, duplikat), wtedy nie ma przycisku wycofania, a żądanie kończy się odmową.
  - Gdy konwener z prawem sędziowania próbuje przywrócić abstrakt „Wycofany”, wtedy dostaje odmowę; gdy ktokolwiek próbuje zresetować abstrakt „Złożony”, wtedy również dostaje odmowę.
  - Gdy ktokolwiek próbuje przenieść abstrakt z powrotem do stanu „Zaproszony”, wtedy interfejs nie oferuje takiej akcji (stan zaproszenia powstaje tylko przy tworzeniu).
