- id: F-WYD-01.2
  domena: WYD
  tytul: Przejścia stanów typu wydarzenia
  zachowanie:
  - Gdy organizator z pełnym uprawnieniem zmienia typ spotkania na konferencję, wtedy widzi komunikat o zmianie typu, strona wydarzenia pokazuje widok konferencji, a w dzienniku jest wpis o zmianie typu.
  - Gdy organizator zmienia typ konferencji na spotkanie, wtedy funkcje dostępne tylko dla konferencji (abstrakty, referaty naukowe, redakcja) znikają z menu zarządzania.
  - Gdy organizator zmienia typ wykładu na spotkanie albo spotkania na wykład, wtedy typ się zmienia, a pozostałe dane wydarzenia zostają bez zmian.
  - Gdy osoba z samym uprawnieniem do rejestracji albo uczestnik próbuje zmienić typ wydarzenia, wtedy dostaje odmowę dostępu, a typ się nie zmienia.
  - Gdy wydarzenie jest zablokowane i organizator próbuje zmienić jego typ, wtedy widzi komunikat, że wydarzenie jest zablokowane i nie można go modyfikować.
  role:
  - organizator
  - administrator
