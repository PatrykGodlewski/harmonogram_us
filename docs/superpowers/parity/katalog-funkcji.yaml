- id: F-WYD-03.4
  domena: WYD
  tytul: Przejścia stanów prośby o przeniesienie wydarzenia
  zachowanie:
  - Gdy zarządca akceptuje prośbę oczekującą, wtedy prośba ma stan „zaakceptowana” i znika z listy oczekujących, a dziennik wydarzenia pokazuje przeniesienie.
  - Gdy zarządca odrzuca prośbę oczekującą, wtedy prośba ma stan „odrzucona”, a dziennik wydarzenia i kategorii pokazuje odrzucenie z uzasadnieniem.
  - Gdy proszący wycofuje prośbę, albo wydarzenie zostaje usunięte, przeniesione bezpośrednio lub objęte nową prośbą, wtedy dotychczasowa prośba ma stan „wycofana”, a dziennik pokazuje wycofanie.
  - Gdy dla wydarzenia istnieje już prośba oczekująca i powstaje nowa, wtedy stara jest wycofana, a oczekująca jest zawsze najwyżej jedna.
  - Gdy ktoś próbuje zaakceptować, odrzucić albo wycofać prośbę, która jest już zaakceptowana, odrzucona lub wycofana, wtedy dostaje błąd i stan prośby się nie zmienia.
