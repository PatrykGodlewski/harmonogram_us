- id: F-WYD-03.1
  domena: WYD
  tytul: Przejścia stanów trybu tworzenia wydarzeń w kategorii
  zachowanie:
  - Gdy zarządca ustawia tryb „ograniczony”, wtedy tylko osoby z uprawnieniem tworzenia wydarzeń widzą tę kategorię jako dostępną w formularzu tworzenia, a pozostali widzą ostrzeżenie, że nie mogą w niej
    tworzyć.
  - Gdy zarządca zmienia tryb z „ograniczony” na „moderowany”, wtedy uczestnik z dostępem do kategorii może zaproponować w niej wydarzenie, a w menu zarządzania kategorią pojawia się sekcja moderacji.
  - Gdy zarządca zmienia tryb z „moderowany” na „otwarty”, wtedy każdy użytkownik z dostępem do kategorii tworzy w niej wydarzenie bez zatwierdzania.
  - Gdy zarządca zmienia tryb z „otwarty” na „ograniczony”, wtedy uczestnik bez uprawnienia tworzenia nie może już utworzyć ani przenieść wydarzenia do tej kategorii.
  - Gdy użytkownik bez dostępu do odczytu chronionej kategorii próbuje w niej tworzyć albo proponować wydarzenie, wtedy dostaje odmowę niezależnie od trybu.
