  - Gdy zarządca przełącza konfigurację z „wyłączona” na „dziedziczona”, wtedy etykieta opcji mówi, czy rodzic ma konfigurację włączoną, i kategoria przejmuje ustawienie rodzica.
  - Gdy zarządca wybiera „włączona” bez podania danych konfiguracji, wtedy widzi błąd walidacji i stan się nie zmienia.
  - Gdy administrator próbuje ustawić „dziedziczona” w kategorii głównej, wtedy taka opcja nie jest dostępna albo zapis kończy się błędem.
