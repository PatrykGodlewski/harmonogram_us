# ---------------------------------------------------------------- wyłączenia (a): adresy legacy
- rodzaj: trasa
  gdy: {blueprint_regex: "^compat_(categories|events|event_management)$"}
  wylaczenie: {powod: a, uzasadnienie: "Przekierowania ze starych adresów Indico 1.x (modpython, legacy ID kategorii i wydarzeń, stary adres ustawień)"}
- rodzaj: trasa
  gdy: {blueprint: categories, endpoint: export_rss}
  wylaczenie: {powod: a, uzasadnienie: "Stary adres kanału RSS kategorii, przekierowany na kanał Atom"}
- rodzaj: trasa
