# Scrapes /api/metrics of the web and admin apps, /metrics of the documents service, (bearer METRICS_TOKEN, mounted by compose)
# and receives k6 results by remote write (pnpm load).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: web
    metrics_path: /api/metrics
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["web:3000"]
  - job_name: admin
    metrics_path: /api/metrics
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["admin:3000"]
  - job_name: documents
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["documents:9464"]
