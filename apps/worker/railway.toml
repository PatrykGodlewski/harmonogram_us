[build]
builder = "DOCKERFILE"
dockerfilePath = "/Dockerfile"
watchPatterns = [
  "/apps/worker/**",
  "/packages/**",
  "/Dockerfile",
  "/pnpm-lock.yaml",
  "/package.json",
  "/turbo.json",
]

[build.args]
APP = "worker"

[deploy]
startCommand = "node dist/index.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
