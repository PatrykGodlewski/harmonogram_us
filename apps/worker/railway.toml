# Railway service "worker". Set the service variable APP=worker: the shared Dockerfile builds the app it names.
[build]
builder = "DOCKERFILE"
dockerfilePath = "/Dockerfile"
watchPatterns = [
  "/apps/worker/**",
  "/packages/**",
  "/Dockerfile",
  "/pnpm-lock.yaml",
  "/package.json",
  "/turbo.json",
]

[deploy]
startCommand = "node dist/index.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
