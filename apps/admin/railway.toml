# Railway service "admin". Set the service variable APP=admin: the shared Dockerfile builds the app it names.
[build]
builder = "DOCKERFILE"
dockerfilePath = "/Dockerfile"
watchPatterns = [
  "/apps/admin/**",
  "/packages/**",
  "/Dockerfile",
  "/pnpm-lock.yaml",
  "/package.json",
  "/turbo.json",
]

[deploy]
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
