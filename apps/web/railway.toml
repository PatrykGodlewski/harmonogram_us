[build]
builder = "DOCKERFILE"
dockerfilePath = "/Dockerfile"
watchPatterns = [
  "/apps/web/**",
  "/packages/**",
  "/Dockerfile",
  "/pnpm-lock.yaml",
  "/package.json",
  "/turbo.json",
]

[build.args]
APP = "web"

[deploy]
preDeployCommand = ["pnpm", "db:migrate"]
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
