# Railway service "web". Set the service variable APP=web: the shared Dockerfile builds the app it names.
[build]
builder = "DOCKERFILE"
dockerfilePath = "/Dockerfile"
watchPatterns = [
  "/apps/web/**",
  "/packages/**",
  "/Dockerfile",
  "/pnpm-lock.yaml",
  "/package.json",
  "/turbo.json",
]

[deploy]
# Straight to drizzle-kit, not `pnpm db:migrate`: Turbo hides undeclared env vars from tasks.
preDeployCommand = ["pnpm", "--filter", "@repo/db", "db:migrate"]
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
