# Railway service "documents": private networking only (no public domain).
# Web and admin reach it at DOCUMENTS_URL=http://documents.railway.internal:50051.
[build]
builder = "DOCKERFILE"
dockerfilePath = "/services/documents/Dockerfile"
watchPatterns = [
  "/services/documents/**",
  "/proto/**",
  "/Cargo.toml",
  "/Cargo.lock",
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
