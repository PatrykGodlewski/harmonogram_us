# Railway service "documents": private networking only (no public domain).
# Web and admin reach it at DOCUMENTS_URL=http://documents.railway.internal:50051.
[build]
builder = "DOCKERFILE"
dockerfilePath = "/services/documents/Dockerfile"
watchPatterns = [
  "/services/documents/**",
  "/proto/**",
  "/Cargo.toml",
  "/Cargo.lock",
]

[deploy]
# HTTP health on the metrics port; Railway probes the port in the service's PORT variable,
# so set PORT=9464 on this service (see .env.example).
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
