# Weekly, grouped version updates; security updates are on in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: next
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: next
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: next
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/, /services/documents]
    schedule: { interval: weekly, day: monday }
    target-branch: next
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: next
